name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyD9mqqnEEtiqzDNwoSO14sW_vfr1jESGag"
          VITE_FIREBASE_AUTH_DOMAIN: "vote-11e16.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "vote-11e16"
          VITE_FIREBASE_STORAGE_BUCKET: "vote-11e16.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "848149999029"
          VITE_FIREBASE_APP_ID: "1:848149999029:web:af5c95f0de3d2229987dfc"
          VITE_FIREBASE_MEASUREMENT_ID: "G-ZYK23Q7E5J"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
